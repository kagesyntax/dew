name: Bug report
description: Something in Dew is broken
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → Software Update shows it
      placeholder: "0.1.0 (19ced32)"
  - type: input
    id: device
    attributes:
      label: Phone or computer
