# Continuous Delivery: tag a version (vX.Y.Z) on main to ship it.
#   1. Verifies the tag matches Cargo.toml
#   2. Builds the web app with production config from repository secrets
#   3. Publishes version.json (read by Settings → Check for Updates)
#   4. Deploys to GitHub Pages and creates a GitHub Release with the web bundle
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y dioxus-cli@0.7.10

      - name: Read version
        id: version
        run: |
          V=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $V"; exit 1
          fi

      - name: Tests must pass before shipping
        run: cargo test -p church-core

      - name: Write version.json
        run: |
          cat > public/version.json <<JSON
          {
            "version": "${{ steps.version.outputs.version }}",
            "notes": $(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}" | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read().strip() or "Bug fixes and improvements."))'),
            "url": "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Build
        env:
          CHURCH_NAME: ${{ vars.CHURCH_NAME }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_READONLY_TOKEN }}
          UPDATE_MANIFEST_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/version.json
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          sed -i 's|^\[web.app\]|[web.app]\nbase_path = "${{ github.event.repository.name }}"|' Dioxus.toml
          dx bundle --platform web --release
          OUT=target/dx/church-app/release/web/public
          cp "$OUT/index.html" "$OUT/404.html"   # SPA deep links on GitHub Pages
          (cd "$OUT" && zip -qr "$GITHUB_WORKSPACE/church-app-web.zip" .)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/church-app/release/web/public
      - id: deploy
        uses: actions/deploy-pages@v4

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: church-app-web.zip
          generate_release_notes: true
