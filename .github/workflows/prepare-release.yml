# One click release prep: Actions -> Prepare Release -> Run workflow.
# Bumps the version in Cargo.toml, turns CHANGELOG's [Unreleased] into the new version, and opens
# a pull request from develop into main. Merging that PR runs release.yml, which ships it and
# makes Settings -> Software Update offer it to every user.
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - id: bump
        run: echo "version=$(python3 tools/release_notes.py bump ${{ inputs.level }})" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update -p church-app --offline || cargo generate-lockfile
      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$V"
          git commit -am "chore(release): v$V"
          git push origin "release/v$V"
          gh pr create --base main --head "release/v$V" --title "Release v$V" \
            --body "$(python3 tools/release_notes.py notes "$V")"
