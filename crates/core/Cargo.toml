[package]
name = "church-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent domain logic: scripture references, manual model, versioning."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
semver = "1"
