[package]
name = "dew"
version = "0.1.0"
authors = ["Kage Syntax <em2009manu2010el@gmail.com>"]
edition = "2021"
description = "Dew: the Bible and the teens' Sunday School manual for AGC Oshodi, built with Dioxus."
license = "MIT"
rust-version = "1.85"

[workspace]
members = [".", "crates/core"]
resolver = "2"

[dependencies]
church-core = { path = "crates/core" }
dioxus = { version = "0.7.1", features = ["router"] }
# Dioxus Labs first-party UI: icons (Lucide) + headless primitives behind `dx components`.
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# wasm-bindgen needs its custom sections; dx runs wasm-opt to shrink the output
strip = false
panic = "abort"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
